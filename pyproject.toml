[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragdbman"
version = "0.4.1"
description = "Inspectable local document intelligence, SQLite retrieval, and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Bela Istvan MIHALIK"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "mcp>=1.12,<2", "pydantic>=2.9,<3", "python-multipart>=0.0.18",
  "sqlite-vec>=0.1.6,<0.2", "tokenizers>=0.21,<1", "tomli-w>=1.1,<2",
  "charset-normalizer>=3.4,<4", "beautifulsoup4>=4.12,<5",
  "markdown-it-py>=3,<5", "pypdf[crypto]>=5,<7",
  "openpyxl>=3.1,<4", "defusedxml>=0.7,<1", "mobi>=0.3,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
pymupdf = ["pymupdf>=1.25,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
ragdbman = "ragdbman.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/ragdbman"]

[tool.hatch.build.targets.wheel.force-include]
"CITATION.cff" = "ragdbman/CITATION.cff"
"codemeta.json" = "ragdbman/codemeta.json"
